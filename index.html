    .legend { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #475569; }

    .dot.large { width: 16px; height: 16px; background: #f59e0b; border: 1px solid #b45309; }
    .dot.medium { width: 12px; height: 12px; background: #60a5fa; border: 1px solid #2563eb; }
    .dot.small { width: 10px; height: 10px; background: #d1d5db; border: 1px solid #6b7280; }
    #network {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 72px;
      width: 100%;
      height: calc(100vh - 72px);
      height: calc(100dvh - 72px);
      overflow: hidden !important;
      background: #f8fafc;
    }
    #network canvas { display: block !important; }
    .status { font-size: 13px; color: #475569; }
    #characterTooltip {
      position: fixed;
      z-index: 99999;
      display: none;
      width: min(360px, calc(100vw - 24px));
      max-height: min(360px, calc(100vh - 24px));

      padding: 12px 14px;

      border-radius: 10px;
      background: rgba(255,255,255,.98);
      box-shadow: 0 12px 30px rgba(15,23,42,.22);
      pointer-events: none;
      font-size: 14px;
      line-height: 1.55;
    }
    #characterTooltip .tooltip-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    #characterTooltip .tooltip-row { margin-top: 4px; }
    #characterTooltip .tooltip-label { font-weight: 700; color: #475569; }

      margin-left: auto;
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #f8fafc;
      flex: 0 0 auto;
    }
    .toolbar .language-toggle button {
      padding: 5px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #64748b;
      font-size: 13px;
      line-height: 1.2;
      cursor: pointer;
    }
    .toolbar .language-toggle button:hover { background: #f1f5f9; }
    .toolbar .language-toggle button.active {

      color: #ffffff;

  <script>
    const container = document.getElementById('network');

    // 言語切替用に、現在の日本語表示を保存して英語情報を追加する。
    networkData.nodes.forEach((node) => {
      const bilingual = bilingualData[String(node.id)] || {};
      node.jpLabel = node.label;
      node.jpTitle = node.title;
      node.enLabel = bilingual.enLabel || node.label;
      node.enDescription = bilingual.enDescription || '';
    });

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function translateImportance(value) {
      const replacements = [
        ['主要人物周辺', 'Main-character circle'],
        ['準主要人物', 'Secondary character'],
        ['主要人物', 'Major character'],
        ['脇役', 'Supporting character'],
        ['端役', 'Minor character'],
        ['ゲイツ＝トラヴァース家', 'Gates–Traverse family'],
        ['ウェイヴォーン家', 'Wayvone family'],
        ['24fps・学生運動', '24fps / student movement'],
        ['くの一・日本', 'Kunoichi / Japan'],
        ['シンデルロ', 'Thanatoid'],
        ['音楽・バンド', 'Music / bands'],
        ['音楽・メディア', 'Music / media'],
        ['映画・テレビ', 'Film / television'],
        ['ヴァインランドの住人', 'Vineland residents'],
        ['権力側', 'Government / authority'],
        ['家族', 'Family'],
        ['その他', 'Other']
      ];
      let result = value || '';
      replacements.forEach(([ja, en]) => { result = result.split(ja).join(en); });
      return result.replaceAll('／', ' / ');
    }

    function buildEnglishTitle(node) {
      const importanceMatch = (node.jpTitle || '').match(/<b>重要度・分類:<\/b>\s*([^<]+)/);
      const importance = importanceMatch ? translateImportance(importanceMatch[1].trim()) : '';
      return "<div style='max-width:320px'><b>" + escapeHtml(node.enLabel) +
        "</b><br><b>Name:</b> " + escapeHtml(node.enLabel) +
        "<br><b>Importance / Category:</b> " + escapeHtml(importance) +
        "<br><b>Description:</b> " + escapeHtml(node.enDescription) + "</div>";
    }

    let currentLanguage = 'ja';

    // 重要度の判定は「準主要人物」を先に行う。
    // 「準主要人物」には文字列として「主要人物」が含まれるため、順序が逆だと全て最大サイズになる。
    networkData.nodes.forEach((node) => {
      const info = node.title || '';
      if (info.includes('準主要人物')) {
        node.size = 28;
        node.mass = 1.4;
        node.color = { background: '#60a5fa', border: '#2563eb', highlight: { background: '#93c5fd', border: '#1d4ed8' } };
      } else if (info.includes('主要人物')) {
        node.size = 38;
        node.mass = 2;
        node.color = { background: '#f59e0b', border: '#b45309', highlight: { background: '#fbbf24', border: '#92400e' } };
      } else {
        node.size = 18;
        node.mass = 1;
        node.color = { background: '#d1d5db', border: '#6b7280', highlight: { background: '#e5e7eb', border: '#4b5563' } };
      }
    });

    networkData.edges.forEach((edge) => {
      edge.jpTitle = edge.title;
      edge.enTitle = edgeEnglishTitles[String(edge.id)] || edge.title;
    });

    const nodes = new vis.DataSet(networkData.nodes);
    const edges = new vis.DataSet(networkData.edges);
    const data = { nodes, edges };

    const options = {
      autoResize: false,
      interaction: { hover: true, tooltipDelay: 120, multiselect: true, navigationButtons: true, keyboard: true },
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: -55, centralGravity: 0.015, springLength: 145, springConstant: 0.06 },
        stabilization: { iterations: 250, fit: true }
      },
      nodes: {
        borderWidth: 1.5,
        shadow: true
      },
      edges: {
        shadow: false,
        selectionWidth: 2,
        hoverWidth: 1.2
      }
    };

    function sizeNetworkViewport() {
      const toolbar = document.querySelector('.toolbar');
      const toolbarHeight = Math.ceil(toolbar.getBoundingClientRect().height);
      const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const networkHeight = Math.max(240, Math.floor(viewportHeight - toolbarHeight));
      container.style.top = toolbarHeight + 'px';
      container.style.height = networkHeight + 'px';
      container.style.maxHeight = networkHeight + 'px';
    }

    sizeNetworkViewport();
    
    if (typeof vis === 'undefined' || !vis.Network || !vis.DataSet) {
      const errorBox = document.createElement('div');
      errorBox.style.cssText = 'position:absolute;inset:80px 20px auto 20px;padding:18px;background:#fff7ed;border:2px solid #f97316;border-radius:10px;color:#9a3412;font-size:16px;z-index:9999;';
      errorBox.innerHTML = '<b>相関図ライブラリを読み込めませんでした。</b><br>ブラウザの広告・追跡防止機能、またはネットワーク設定でCDNが遮断されている可能性があります。ページを再読み込みするか、別ブラウザで確認してください。';
      document.body.appendChild(errorBox);
      throw new Error('vis-network library failed to load');
    }

    const network = new vis.Network(container, data, options);
    network.setSize('100%', container.style.height);

    let resizeTimer = null;
    function handleViewportResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        sizeNetworkViewport();
        network.setSize('100%', container.style.height);
        network.redraw();
      }, 80);
    }
    window.addEventListener('resize', handleViewportResize, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleViewportResize, { passive: true });
    }


    // vis-network標準のtitleツールチップは、埋め込みプレビュー等で表示されないことがある。
    // そのため、hoverNodeイベントから独自の解説ボックスを表示する。
    const characterTooltip = document.getElementById('characterTooltip');

    function placeTooltip(domX, domY) {
      const rect = container.getBoundingClientRect();
      const gap = 16;
      let left = rect.left + domX + gap;
      let top = rect.top + domY + gap;

      characterTooltip.style.display = 'block';
      const tipRect = characterTooltip.getBoundingClientRect();

      if (left + tipRect.width > window.innerWidth - 8) {
        left = rect.left + domX - tipRect.width - gap;
      }
      if (top + tipRect.height > window.innerHeight - 8) {
        top = rect.top + domY - tipRect.height - gap;
      }

      characterTooltip.style.left = Math.max(8, left) + 'px';
      characterTooltip.style.top = Math.max(8, top) + 'px';
    }

    network.on('hoverNode', (params) => {
      const node = nodes.get(params.node);
      if (!node) return;
      characterTooltip.innerHTML = node.title || ('<b>' + node.label + '</b>');
      placeTooltip(params.pointer.DOM.x, params.pointer.DOM.y);
    });

    network.on('blurNode', () => {
      characterTooltip.style.display = 'none';
    });

    network.on('dragStart', () => {
      characterTooltip.style.display = 'none';
    });

    container.addEventListener('mouseleave', () => {
      characterTooltip.style.display = 'none';
    });

    // 初期配置が落ち着いたら物理演算を止め、再描画とCPU使用を抑える。
    network.once('stabilizationIterationsDone', () => {
      network.setOptions({ physics: { enabled: false } });
      document.getElementById('physicsToggle').checked = false;
      network.fit({ animation: { duration: 350, easingFunction: 'easeInOutQuad' } });
    });

    function findNodeByLabel(query) {
      const q = query.trim();
      if (!q) return null;
      const activeLabel = (n) => currentLanguage === 'en' ? n.enLabel : n.jpLabel;
      const exact = networkData.nodes.find(n => activeLabel(n) === q) ||
                    networkData.nodes.find(n => n.jpLabel === q || n.enLabel === q);
      if (exact) return exact;
      const qLower = q.toLowerCase();
      const partial = networkData.nodes.find(n => activeLabel(n).toLowerCase().includes(qLower)) ||
                      networkData.nodes.find(n => n.jpLabel.toLowerCase().includes(qLower) || n.enLabel.toLowerCase().includes(qLower));
      return partial || null;
    }

    function setLanguage(lang) {
      if (lang !== 'ja' && lang !== 'en') return;
      currentLanguage = lang;

      const updates = networkData.nodes.map((node) => ({
        id: node.id,
        label: lang === 'en' ? node.enLabel : node.jpLabel,
        title: lang === 'en' ? buildEnglishTitle(node) : node.jpTitle
      }));
      nodes.update(updates);

      const edgeUpdates = networkData.edges.map((edge) => ({
        id: edge.id,
        title: lang === 'en' ? edge.enTitle : edge.jpTitle
      }));
      edges.update(edgeUpdates);

      const jaButton = document.getElementById('langJa');
      const enButton = document.getElementById('langEn');
      jaButton.classList.toggle('active', lang === 'ja');
      enButton.classList.toggle('active', lang === 'en');
      jaButton.setAttribute('aria-pressed', String(lang === 'ja'));
      enButton.setAttribute('aria-pressed', String(lang === 'en'));

      const isEnglish = lang === 'en';
      document.getElementById('searchBox').placeholder = isEnglish
        ? 'Search character name (e.g. Prairie)'
        : 'キャラクター名で検索（例: プレーリー）';
      document.getElementById('searchBtn').textContent = isEnglish ? 'Search & Focus' : '検索して移動';
      document.getElementById('resetBtn').textContent = isEnglish ? 'Show All' : '全体表示';
      document.getElementById('physicsLabel').textContent = isEnglish ? 'Physics simulation' : '物理シミュレーション';
      document.getElementById('legendMajor').textContent = isEnglish ? 'Major character' : '主要人物';
      document.getElementById('legendSecondary').textContent = isEnglish ? 'Secondary character' : '準主要人物';
      document.getElementById('legendOther').textContent = isEnglish ? 'Other' : 'その他';
      const status = document.getElementById('networkStatus');
      if (status) status.textContent = isEnglish ? 'Nodes 113 / Edges 170' : 'ノード 113 / エッジ 170';
      document.documentElement.lang = isEnglish ? 'en' : 'ja';

      characterTooltip.style.display = 'none';
      network.redraw();
    }

    document.getElementById('langJa').addEventListener('click', () => setLanguage('ja'));
    document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));

    document.getElementById('searchBtn').addEventListener('click', () => {
      const q = document.getElementById('searchBox').value;
      const node = findNodeByLabel(q);
      if (!node) {
        alert(currentLanguage === 'en' ? 'No matching character was found.' : '該当するキャラクターが見つかりませんでした。');
        return;
      }
      network.selectNodes([node.id]);
      network.focus(node.id, { scale: 1.25, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    });

    document.getElementById('searchBox').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      network.unselectAll();
      network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    });

    document.getElementById('physicsToggle').addEventListener('change', (e) => {
      network.setOptions({ physics: { enabled: e.target.checked } });
    });
  </script>
</body>
</html>
